[ids]
# type folio
2edd:0001

[main]
end = layer(meta)
= = -
\ = ~

[shift:S]
= = -
\ = grave
; = :
' = "
, = <
. = >
/ = ?

[meta:M]
1 = esc
= = =
\ = \
0 = +
, = [
. = ]
right = end
left = home
up = pageup
down = pagedown

[meta+alt]
4 = macro(leftalt+f4)

[meta+shift]
\ = |
[ = {
] = }
, = {
. = }

[control+shift]
1 = macro(leftcontrol+leftshift+esc)
