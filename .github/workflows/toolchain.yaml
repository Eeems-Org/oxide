name: Build toolchain images
on:
  pull_request: &on-filter
    branches:
      - master
    paths:
      - .github/workflows/toolchain.yaml
      - "toolchain/**"
      - "Makefile"
  push: *on-filter

permissions:
  contents: read
  packages: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - rm1
          - rm2
          - rmpp
          - rmppm
          - rmppure
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get toolchain version
        id: toolchain
        run: |
          version=$(grep '^TOOLCHAIN?=' Makefile | cut -d= -f2)
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Upgrade podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Install Podman
        uses: redhat-actions/podman-install@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        if: github.repository == 'Eeems-Org/oxide' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Generate tags
        id: meta
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
          DEVICE: ${{ matrix.device }}
        run: |
          IMAGE_NAME=ghcr.io/eeems-org/oxide-toolchain
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${IMAGE_NAME}:${VERSION}-${DEVICE}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

      - name: Build and push
        run: |
          make PODMAN=docker toolchain-${{ matrix.device }} \
            TOOLCHAIN=${{ steps.toolchain.outputs.version }} \
            REVISION=${{ github.sha }}

      - name: Push toolchain container
        if: ${{ github.repository == 'Eeems-Org/oxide' && github.event_name == 'push' }}
        run: |
          podman push ghcr.io/eeems-org/oxide-toolchain:${{ steps.toolchain.outputs.version }}-${{ matrix.device }}
